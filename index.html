<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoogvliet Academy - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --hoogvliet-blue: #004c97;
            --hoogvliet-green: #86bc25;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .container { 
            width: 95%;
            max-width: 600px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header {
            background: linear-gradient(135deg, var(--hoogvliet-blue), #003366);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid var(--hoogvliet-green);
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .dashboard-content {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255,255,255,0.2);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.3em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card p {
            color: var(--text-dim);
            font-size: 0.95em;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: var(--hoogvliet-green);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: 0.2s;
            text-align: center;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        /* Resultaten tabel styling */
        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        .result-item:nth-child(1) {
            border-left: 4px solid #ffd700; /* Goud voor #1 */
            background: rgba(255, 215, 0, 0.1);
        }

        .result-item:nth-child(2) {
            border-left: 4px solid #c0c0c0; /* Zilver voor #2 */
        }

        .result-item:nth-child(3) {
            border-left: 4px solid #cd7f32; /* Brons voor #3 */
        }

        .grade-badge {
            font-weight: 800;
            font-size: 1.1em;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .grade-good {
            background: rgba(134, 188, 37, 0.2);
            color: var(--hoogvliet-green);
            border: 1px solid var(--hoogvliet-green);
        }

        .grade-bad {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.8em;
            text-decoration: underline;
            padding: 0;
        }

        .clear-btn:hover {
            color: #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Hoogvliet Academy</h1>
        <p style="color: var(--text-dim); margin-top: 5px; letter-spacing: 1px;">EXAMEN TRAINING</p>
    </div>
    
    <div class="dashboard-content">
        <!-- Module 1: Kostentoets -->
        <div class="card" style="border-color: rgba(134, 188, 37, 0.4);">
            <h3>Kostentoets & Financiën</h3>
            <p>Oefen met alle 70 begrippen over bedrijfskosten, afschrijvingen, resultaten, break-even en kostprijzen uit het nieuwste boek.</p>
            <a href="kostentoets.html" class="btn">Start Kostentoets</a>
        </div>

        <!-- Module 2: Recente Resultaten Top 10 -->
        <div class="card">
            <h3>
                Top 10 Beste Resultaten
                <button onclick="clearHistory()" class="clear-btn">Wis geschiedenis</button>
            </h3>
            <div id="results-container">
                <!-- Wordt dynamisch gevuld vanuit JS -->
            </div>
        </div>
    </div>
</div>

<script>
function loadResults() {
    const container = document.getElementById('results-container');
    let resultaten = JSON.parse(localStorage.getItem('hoogvliet_toets_resultaten')) || [];

    if (resultaten.length === 0) {
        container.innerHTML = "<p style='color: var(--text-dim); text-align: center; margin: 10px 0;'>Nog geen toetsen gemaakt. Start je eerste toets hierboven!</p>";
        return;
    }

    // Sorteer op cijfer (hoog naar laag), bij gelijke stand op de meest recente datum
    resultaten.sort((a, b) => b.cijfer - a.cijfer);

    // Pak uitsluitend de top 10
    const top10 = resultaten.slice(0, 10);

    let html = '<ul class="results-list">';
    top10.forEach((res, index) => {
        const isVoldoende = res.cijfer >= 5.5;
        const badgeClass = isVoldoende ? 'grade-good' : 'grade-bad';
        
        html += `
            <li class="result-item">
                <div>
                    <strong>#${index + 1}</strong> &nbsp;
                    <span style="color: var(--text-dim); font-size: 0.9em;">${res.datum}</span>
                </div>
                <div>
                    <span style="margin-right: 10px; color: var(--text-dim); font-size: 0.9em;">${res.score}/30 goed</span>
                    <span class="grade-badge ${badgeClass}">${res.cijfer.toFixed(1)}</span>
                </div>
            </li>
        `;
    });
    html += '</ul>';

    container.innerHTML = html;
}

function clearHistory() {
    if (confirm("Weet je zeker dat je alle opgeslagen resultaten wilt wissen?")) {
        localStorage.removeItem('hoogvliet_toets_resultaten');
        loadResults();
    }
}

// Laad direct de resultaten bij het openen van de pagina
loadResults();
</script>

</body>
</html>
