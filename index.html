<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoogvliet Academy - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --hoogvliet-blue: #004c97;
            --hoogvliet-green: #86bc25;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 95%;
            max-width: 800px; 
            background: var(--card-bg); 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header {
            background: linear-gradient(135deg, var(--hoogvliet-blue), #003366);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 4px solid var(--hoogvliet-green);
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .dashboard-content {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--hoogvliet-green);
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.4em;
        }

        .card p {
            color: var(--text-dim);
            font-size: 0.95em;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: var(--hoogvliet-green);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 800;
            text-transform: uppercase;
            box-sizing: border-box;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn-blue {
            background: var(--hoogvliet-blue);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Hoogvliet Academy</h1>
        <p style="color: var(--text-dim); margin-top: 10px; letter-spacing: 1px;">EXAMEN TRAINING & MODULES</p>
    </div>
    
    <div class="dashboard-content">
        <!-- Module 1: Kostentoets & Financiën -->
        <div class="card">
            <div>
                <h3>Kostentoets & Financiën</h3>
                <p>Train alle 70 begrippen over bedrijfskosten, afschrijvingen, resultaten, break-even en kostprijzen uit het nieuwste boek.</p>
            </div>
            <a href="kostentoets.html" class="btn">Start Kostentoets</a>
        </div>
    </div>
</div>

</body>
</html>
