            background: rgba(255,255,255,0.05); 
            padding: 18px; 
            margin: 12px 0; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 2px solid transparent; 
            transition: all 0.3s ease;
            font-size: 1.05em;
        }

        .option:hover { 
            background: rgba(255,255,255,0.1); 
            border-color: var(--text-dim);
            transform: translateX(5px);
        }

            background: var(--hoogvliet-blue) !important; 
            border-color: var(--hoogvliet-green) !important;

            background: var(--hoogvliet-green); 
            color: #000; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            font-size: 1.1em;

let selected = [];
let cur = 0;
let score = 0;
let errors = [];
let choice = null;

function start() {
    selected = [...fullPool].sort(() => 0.5 - Math.random()).slice(0, 30);
    cur = 0; score = 0; errors = [];
    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("result-area").style.display = "none";
    show();
}

function show() {
    choice = null;
    const qData = selected[cur];
    
    let options = qData.a.map((text, index) => ({ text, index }));
    options.sort(() => 0.5 - Math.random());

    document.getElementById("counter").innerText = "Vraag " + (cur + 1) + "/30";
    document.getElementById("q-text").innerText = qData.q;
    
    const optArea = document.getElementById("options-area");
    optArea.innerHTML = "";
    
    options.forEach((opt) => {
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = opt.text;
        d.onclick = () => {
            document.querySelectorAll(".option").forEach(e => e.className = "option");
            d.className = "option selected";
            choice = opt.index;
        };
        optArea.appendChild(d);
    });
}

function handleNext() {
    if (choice === null) return alert("Selecteer een antwoord!");
    if (choice === selected[cur].c) {
        score++;
    } else {
        errors.push({
            q: selected[cur].q, 
            u: selected[cur].a[choice], 
            c: selected[cur].a[selected[cur].c]
        });
    }
    
    cur++;
    if (cur < 30) show();
    else end();
}

function triggerFeest() {
    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#86bc25', '#004c97', '#ffffff']
    });
}

function end() {
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    
    document.getElementById("final-score").innerText = score + "/30";
    
    let grade = (score / 30) * 10;
    document.getElementById("grade-text").innerText = "Je cijfer is een: " + grade.toFixed(1);

    // --- NIEUW: Resultaat opslaan in localStorage ---
    const huidigResultaat = {
        datum: new Date().toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        score: score,
        cijfer: parseFloat(grade.toFixed(1))
    };

    // Haal bestaande resultaten op of maak een lege lijst
    let resultaten = JSON.parse(localStorage.getItem('hoogvliet_toets_resultaten')) || [];
    
    // Voeg het nieuwe resultaat toe
    resultaten.push(huidigResultaat);
    
    // Sla de bijgewerkte lijst op
    localStorage.setItem('hoogvliet_toets_resultaten', JSON.stringify(resultaten));
    // ------------------------------------------------

    if (score >= 17) {
        triggerFeest();
    }

    const log = document.getElementById("error-log");
    log.innerHTML = "";
    if (errors.length > 0) {
        log.innerHTML = "<h3>Verbeterpunten:</h3>";
        errors.forEach(e => {
            log.innerHTML += `
                <div class="error-card">
                    <b>${e.q}</b><br>
                    <span style="color:#f87171">Jouw antwoord: ${e.u}</span><br>
                    <span style="color:#86bc25">Juist: ${e.c}</span>
                </div>`;
        });
    } else {
        log.innerHTML = "<p style='color: var(--hoogvliet-green); font-weight: bold;'>Gefeliciteerd! Alle vragen in één keer goed!</p>";
    }
}
